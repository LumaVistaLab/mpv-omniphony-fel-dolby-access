# Omniphony 7.1.4 speaker profile (speaker output is the default).
# Master gain is shared by the speaker and binaural paths and is set to 0 dB.
# The playback script passes the detected bridge path at launch time.
render:
  # Windows Spatial Sound routes static objects by speaker identity, not by
  # renderer output index. This keeps all four height channels identifiable.
  output_channel_mapping: by_name
  current_layout:
    radius_m: 1.5
    speakers:
    - name: FL
      coord_mode: cartesian
      x: -1.0
      y: 1.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: FR
      coord_mode: cartesian
      x: 1.0
      y: 1.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: C
      coord_mode: cartesian
      x: 0.0
      y: 1.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: LFE
      coord_mode: cartesian
      x: 1.0
      y: 1.0
      z: -1.0
      spatialize: false
      delay_ms: 0.0
    - name: BL
      coord_mode: cartesian
      x: -1.0
      y: -1.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: BR
      coord_mode: cartesian
      x: 1.0
      y: -1.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: SL
      coord_mode: cartesian
      x: -1.0
      y: 0.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: SR
      coord_mode: cartesian
      x: 1.0
      y: 0.0
      z: 0.0
      spatialize: true
      delay_ms: 0.0
    - name: TFL
      coord_mode: cartesian
      x: -1.0
      y: 1.0
      z: 1.0
      spatialize: true
      delay_ms: 0.0
    - name: TFR
      coord_mode: cartesian
      x: 1.0
      y: 1.0
      z: 1.0
      spatialize: true
      delay_ms: 0.0
    - name: TBL
      coord_mode: cartesian
      x: -1.0
      y: -1.0
      z: 1.0
      spatialize: true
      delay_ms: 0.0
    - name: TBR
      coord_mode: cartesian
      x: 1.0
      y: -1.0
      z: 1.0
      spatialize: true
      delay_ms: 0.0
  vbap_elevation_resolution: 90
  evaluation_cartesian_x_size: 62
  evaluation_cartesian_y_size: 62
  evaluation_cartesian_z_size: 15
  evaluation_cartesian_z_neg_size: 0
  master_gain: 0.0
  room_width_m: 3.0
  room_front_m: 1.75
  room_rear_m: 1.75
  room_height_m: 1.2
  room_lower_m: 1.2
  room_ratio_center_blend: 0.5
  osc: true
  osc_metering: true
  auto_gain: false
  meter_rate: 10.0
  diag_rate: 10.0
  binaural:
    output_mode: speaker
    unit_scale_m: 1.5
    head_radius_m: 0.0875
    hrir_source: saf
    head_tracking:
      format: auto
    reflections:
      enabled: false
      room_width_m: 4.0
      room_depth_m: 5.0
      room_height_m: 2.7
      level: 0.0
    reverb:
      enabled: false
      level: 0.0
      rt60_s: 0.35
      predelay_ms: 20.0
    air_absorption: true
