# Keep playback statistics live until the same key is pressed again.
# mpv's default lowercase "i" binding is a four-second one-shot snapshot.
i script-binding stats/display-page-1-toggle
I script-binding stats/display-page-1-toggle

# Open the same native track selectors for local files and Bilibili DASH streams.
Ctrl+v script-binding select/select-vid
Ctrl+a script-binding select/select-aid
